spring:
  application:
    name: hackathon_team2_be
  datasource:
    url: jdbc:mysql://localhost:3306/hackathon_2
    username: hackathon
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

ai:
  openai:
    api-key: ${OPENAI_API_KEY:${GEMINI_API_KEY:}}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    model: ${AI_MODEL:gpt-4o-mini}