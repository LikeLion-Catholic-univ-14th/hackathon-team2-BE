spring:
  application:
    name: hackathon_team2_be

  datasource:
    url: jdbc:mysql://localhost:3306/hackathon_2
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

ai:
  openai:
    api-key: ${OPENAI_API_KEY:${GEMINI_API_KEY:}}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    model: ${AI_MODEL:gpt-4o-mini}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
    model: ${IMAGEN_MODEL:gemini-2.5-flash-image}