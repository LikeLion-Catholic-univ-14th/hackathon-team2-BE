spring.application.name=hackathon_team2_be

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# AI Config (Supports Gemini or OpenAI API Key)
ai.openai.api-key=${GEMINI_API_KEY:${OPENAI_API_KEY:}}
ai.openai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/openai}
ai.openai.model=${AI_MODEL:gemini-1.5-flash}
